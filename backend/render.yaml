services:
  - type: web
    name: maanak-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from app.main import app; assert app"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DEMO_DATA_MODE
        value: false
      - key: MOCK_AI_MODE
        value: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
